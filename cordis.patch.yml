# @dsh-external/dsh-usage-board — DSH bundle patch.
# Host half: 扫描 ~/.dsh/sessions 全部文件夹的会话日志（zstd jsonl），
#   增量索引逐小时 token 用量，按模型计价规则折算费用，暴露同源 API：
#     GET /api/dsh-usage-board/summary?range=1d|7d|30d|all[&refresh=1]
#     GET /api/dsh-usage-board/pricing
#     GET/PUT /api/dsh-usage-board/config
# Client half: 在设置面板注册 settings.section「用量看板」：
#   时间筛选（近 1 天 / 7 天 / 30 天 / 全部）+ 模型明细表 + 文件夹明细表 + 各模型花费折线图。
- insert:
    - id: dsh-usage-board
      name: '@dsh-external/dsh-usage-board'
